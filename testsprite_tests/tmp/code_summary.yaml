version: "2"
type: backend
tech_stack:
  - C# 12 / .NET 8
  - WPF (Windows Presentation Foundation, MVVM)
  - Entity Framework Core 8
  - SQLite (default OpenLabDbContext provider)
  - System.Printing / FlowDocument (XPS print pipeline)
  - Microsoft.Extensions.DependencyInjection
  - xUnit + Open_lab.Tests / Open_lab.IntegrationTests
features:
  - name: Patient Registration & CRUD
    description: >
      Core patient master-data workflow exposed by IPatientService and orchestrated
      by PatientRegistrationViewModel. Covers validation, normalization, LabId
      auto-generation, audit logging, transactional registration save, and
      referral-contract assignment.
    files:
      - Open_lab/ViewModels/PatientRegistrationViewModel.cs
      - Open_lab/Services/PatientService.cs
      - Open_lab/Services/IPatientService.cs
    endpoints:
      - method: CALL
        path: PatientService.CreateAsync(Patient)
        description: >
          Validates business rules (FullName/Gender/LabId required, Gender in
          {Male,Female,ذكر,أنثى}, BirthDate not in future), validates referral
          contract existence, auto-generates LabId if blank, rejects duplicate
          LabId, persists patient.
        auth_required: true
        request_schema:
          body:
            LabId: string (optional, auto-generated if empty)
            FullName: string (required, trimmed)
            Gender: string (required, must be one of Male/Female/ذكر/أنثى)
            BirthDate: DateTime? (must not be in the future)
            Age: int?
            AgeUnit: string (Day/Month/Year, normalized)
            ReferralId: int? (must exist in Referrals if provided)
            Phone: string?
            Address: string?
            IsVip: bool
            IsPregnant: bool
        response_schema:
          "200": Patient (persisted, PatientId > 0)
          "400": ArgumentException (validation)
          "409": InvalidOperationException (duplicate LabId / unknown referral)
      - method: CALL
        path: PatientService.UpdateAsync(Patient, userId)
        description: >
          Updates an existing patient, validates referral, prevents LabId
          collision with other patients, writes an EDIT_PATIENT audit log when
          any field changes. Phase 0 fix C-02 ensures Age, AgeUnit, IsVip,
          IsPregnant, HomePhone, NationalId, Email are no longer silently dropped.
        auth_required: true
        response_schema:
          "200": OK
          "404": InvalidOperationException (Patient not found)
          "409": InvalidOperationException (LabId already exists)
      - method: CALL
        path: PatientService.GenerateNextLabIdAsync(forDate)
        description: >
          Generates the next LabId for a given date using format yyyyMMdd + 3-digit
          sequence. Scans existing LabIds with the same date prefix, picks max+1,
          loops until candidate is unique.
        auth_required: true
        response_schema:
          "200": string (e.g. "20260527001")
      - method: CALL
        path: PatientService.GetByLabIdAsync(labId)
        description: Returns the patient with the given LabId, or null.
        auth_required: true
        response_schema:
          "200": Patient?
          "400": ArgumentException (labId blank)
      - method: CALL
        path: PatientService.SearchAsync(name, phone, date?, labId?)
        description: >
          Filters patients by partial name, phone, lab id, and/or any visit on
          the given date. Used by both the "Search" form and the "Today's
          patients" quick list. Returns patients ordered by FullName.
        auth_required: true
        response_schema:
          "200": List<Patient>
      - method: CALL
        path: PatientService.SaveRegistrationAsync(Patient, Visit, IEnumerable<VisitTest>, Invoice)
        description: >
          Atomic registration: wraps Patient + Visit + VisitTests + Invoice
          in a single EF Core transaction (Phase 0 Fix #2). Validates business
          rules, generates LabId when missing, rolls back on any failure.
          Returns the new VisitId.
        auth_required: true
        response_schema:
          "200": int (visitId)
          "400": ArgumentException / ArgumentNullException
          "409": InvalidOperationException (duplicate LabId / unknown referral)
      - method: CALL
        path: PatientService.DeleteAsync(patientId)
        description: >
          Refuses to delete patients that have any visit. No-op when patient
          does not exist.
        auth_required: true
        response_schema:
          "200": OK
          "409": InvalidOperationException (patient has visits)
      - method: CALL
        path: PatientService.AssignReferralAsync(patientId, referralId, userId)
        description: >
          Re-assigns the patient to a referral contract, requires positive
          userId, validates the referral exists, writes an
          ASSIGN_PATIENT_CONTRACT audit log when the value changes.
        auth_required: true
      - method: CALL
        path: PatientService.GetMedicalHistoryAsync(patientId) / SaveMedicalHistoryAsync(patientId, MedicalHistory)
        description: >
          Reads or upserts the patient's medical history (chronic diseases,
          allergies, medications, notes + 6 boolean condition flags). Trims
          strings, requires the patient to exist on save.
        auth_required: true
    depends_on:
      - Referral / TestCatalog (FK)
      - AuditLog
      - SessionContext / PermissionCodes (PatientsView / PatientsEdit gating in the ViewModel)

  - name: Visit & Visit-Test Assignment
    description: >
      Lifecycle of a lab visit and its assigned tests, implemented by
      VisitService. Enforces account-type rules (Cash vs Referral), prevents
      mutation of Closed visits, blocks removal of tests once a result has
      been entered, resolves test price from the referral's price list,
      and queues send-out tests on the external lab queue.
    files:
      - Open_lab/Services/VisitService.cs
      - Open_lab/Services/IVisitService.cs
    endpoints:
      - method: CALL
        path: VisitService.CreateAsync(Visit)
        description: >
          Creates a visit for an existing patient. Inherits ReferralId from the
          patient if not set, forces AccountType=Referral when a referral is
          present, rejects Referral account type with no referral, defaults
          Status to "Open".
        auth_required: true
        response_schema:
          "200": Visit (persisted)
          "400": ArgumentException (PatientId missing)
          "404": InvalidOperationException (Patient not found)
          "409": InvalidOperationException (Referral account type requires a referral)
      - method: CALL
        path: VisitService.AddTestToVisitAsync(visitId, testId, overridePrice?)
        description: >
          Adds a test to an Open visit. Rejects duplicates and closed visits.
          Resolves price from the visit's referral price list (then default
          price list, then test.Price). Send-out tests auto-enqueue on
          ExternalLabQueues.
        auth_required: true
        response_schema:
          "200": VisitTest
          "404": InvalidOperationException (visit/test not found)
          "409": InvalidOperationException (closed visit / duplicate test)
      - method: CALL
        path: VisitService.RemoveVisitTestAsync(visitTestId)
        description: >
          Removes an unverified visit-test. Refuses if Status==Verified, if
          any non-empty ResultValue exists for it, or if the parent visit is
          Closed.
        auth_required: true
        response_schema:
          "200": OK
          "409": InvalidOperationException (verified / has results / closed visit)
      - method: CALL
        path: VisitService.GetVisitTestsAsync(visitId) / GetByIdAsync(visitId)
        description: >
          Reads-only retrieval used for receipt / worksheet / results screens.
          Includes the Test navigation property when listing.
        auth_required: true
      - method: CALL
        path: VisitService.AddCustomGroupToVisitAsync(visitId, customGroupId)
        description: >
          Adds every test in a CustomGroup to the visit, skipping ones already
          present.
        auth_required: true
    depends_on:
      - PatientService
      - TestCatalogService (PriceList, Test)
      - ExternalLabService (queue insertion)

  - name: Test Catalog & Referrals
    description: >
      Manages the master data the registration screen depends on: tests,
      groups, sample types, units, parameters, reference ranges, comments,
      price lists, custom groups, referrals and physicians. Used by
      PatientRegistrationViewModel to populate "Available tests" and the
      referral dropdown.
    files:
      - Open_lab/Services/TestCatalogService.cs
      - Open_lab/Services/ITestCatalogService.cs
    endpoints:
      - method: CALL
        path: TestCatalogService.GetAllTestsAsync()
        description: Returns all tests ordered by NameReport. Backs the "Available tests" grid.
        auth_required: true
        response_schema:
          "200": List<Test>
      - method: CALL
        path: TestCatalogService.GetReferralsAsync()
        description: Returns all referrals ordered by Name. Backs the referral dropdown.
        auth_required: true
        response_schema:
          "200": List<Referral>
      - method: CALL
        path: TestCatalogService.CreateTestAsync(Test) / UpdateTestAsync(Test) / DeleteTestAsync(testId)
        description: >
          CRUD with validation: Code/NameReport/NameReceipt required, Price>=0,
          send-out tests require CostPrice and PatientPrice. Cannot delete a
          test used by VisitTests, PriceListItems, CustomGroupItems, or
          TestParameters.
        auth_required: true
      - method: CALL
        path: TestCatalogService.CreateReferenceRangeAsync(TestReferenceRange) / UpdateReferenceRangeAsync / GetReferenceRangesAsync(testId)
        description: >
          Validates and normalizes age units (Day/Month/Year), projects
          AgeFrom/AgeTo to days for matching, refuses ranges without numeric
          limits AND without normal text, rejects AgeFrom > AgeTo.
        auth_required: true
      - method: CALL
        path: TestCatalogService.CreateParameterAsync / GetParametersByTestAsync
        description: >
          Manages multi-component test parameters. Auto-numbers OrderNo if
          omitted, rejects duplicate parameter names per test, requires the
          parent test to exist.
        auth_required: true
      - method: CALL
        path: TestCatalogService PriceList endpoints
        description: >
          Create/Update/Get for PriceLists and PriceListItems. Enforces one
          default per referral, rejects negative prices, blocks duplicate
          (PriceListId, TestId) pairs.
        auth_required: true
    depends_on:
      - Referral
      - AgeConverter (unit normalization)

  - name: Result Entry & Verification
    description: >
      Implemented by ResultsService. Stores per-parameter result values with
      flags and comments, drives VisitTest status (Pending → InProgress →
      Completed → Verified), validates results against age/gender/parameter
      scoped reference ranges, logs EDIT_RESULT audits, and exposes the
      previous result for trending. Single-component tests use a single
      ResultValue with ParameterId=null; multi-component tests (e.g. CBC)
      use one ResultValue per TestParameter.
    files:
      - Open_lab/Services/ResultsService.cs
      - Open_lab/Services/IResultsService.cs
    endpoints:
      - method: CALL
        path: ResultsService.SaveResultAsync(visitTestId, parameterId, value, flag, comment[, userId])
        description: >
          Insert-or-update of a ResultValue. Refuses when the VisitTest is
          Verified. Recomputes VisitTest.Status: Completed only when every
          TestParameter has a non-empty value (single-component path falls
          back to "any ResultValue with a value"). Writes an EDIT_RESULT
          audit row when an existing value/flag/comment is changed and a
          userId is supplied.
        auth_required: true
        response_schema:
          "200": OK
          "404": InvalidOperationException (VisitTest not found)
          "409": InvalidOperationException (verified - locked)
      - method: CALL
        path: ResultsService.VerifyVisitTestAsync(visitTestId, userId)
        description: >
          Promotes status to Verified only when every parameter has a value
          (or, for single-component tests, at least one ResultValue exists).
          Stamps VerifiedBy/VerifiedAt on each ResultValue.
        auth_required: true
        response_schema:
          "200": OK
          "409": InvalidOperationException (no results / missing parameters)
      - method: CALL
        path: ResultsService.ReopenVisitTestAsync(visitTestId)
        description: >
          Reverses verification: clears VerifiedBy/VerifiedAt, sets Status
          back to InProgress. Idempotent for non-verified rows.
        auth_required: true
      - method: CALL
        path: ResultsService.ValidateResultAsync(testId, parameterId?, value, gender, age, ageUnit?)
        description: >
          Finds the most specific reference range (prefer ParameterId match,
          then Gender match, age range in days) and tags the value as L/H/N.
          Returns the matched range thresholds plus DefaultComment /
          LowComment / HighComment for auto-commentary.
        auth_required: true
        response_schema:
          "200": ReferenceRangeResult (Flag, LowThreshold, HighThreshold, comments)
      - method: CALL
        path: ResultsService.GetPreviousResultAsync(patientId, testId, excludeVisitTestId)
        description: Returns the most recent prior VisitTest with at least one non-empty result for the same patient and test (drives delta-check on reports).
        auth_required: true
      - method: CALL
        path: ResultsService.MarkVisitTestsCompletedAsync / MarkVisitTestsVerifiedAsync / MarkVisitTestsPrintedAsync / LogVisitReportPrintedAsync
        description: Bulk status transitions + PRINT_REPORT audit logging.
        auth_required: true

  - name: Printing (Receipt, Worksheet, Visit Report, Barcode)
    description: >
      WPF FlowDocument-based print pipeline implemented in PrintService.
      Builds Arabic-localized receipts, worksheet listings (by patient or
      by test), visit reports with prior-result trending, culture/sensitivity
      reports, free-form text reports, and barcode label outputs. The print
      queue is resolved per document type via ISettingsService, with a
      "Microsoft Print to PDF" fallback.
    files:
      - Open_lab/Services/PrintService.cs
      - Open_lab/Services/IPrintService.cs
    endpoints:
      - method: CALL
        path: PrintService.PrintReceiptAsync(ReceiptData, barcodeText?)
        description: >
          Prints the visit receipt: header + patient meta + optional barcode
          text + per-test name/price/status + invoice totals (Total /
          Discount / NetTotal / Paid / Balance / Status). Called from
          PatientRegistrationViewModel.PrintReceiptAsync which rebuilds
          ReceiptData from DB state when a visit has been persisted.
        auth_required: true
      - method: CALL
        path: PrintService.PrintWorksheetByPatientAsync(from, to, rows)
        description: >
          Prints the patient worksheet (one row per visit: VisitId, date,
          patient name, tests count). Called from PatientRegistrationViewModel
          which derives the test count from DB after save.
        auth_required: true
      - method: CALL
        path: PrintService.PrintWorksheetByTestAsync(from, to, rows)
        description: Aggregated worksheet by test name with counts.
        auth_required: true
      - method: CALL
        path: PrintService.PrintBarcodeImageAsync(title, image, barcodeText, info?)
        description: >
          Prints a barcode label: ImageSource (Code-128 etc.), human-readable
          code, and an optional info line.
        auth_required: true
      - method: CALL
        path: PrintService.PrintVisitReportAsync(VisitReportData, isReprint?)
        description: Prints the final visit report including per-test parameter values and previous-value annotations.
        auth_required: true
      - method: CALL
        path: PrintService.PrintCultureReportAsync(CultureReportData)
        description: Prints culture & sensitivity report as an antibiotic/sensitivity/notes table.
        auth_required: true
    depends_on:
      - ISettingsService (printer routing)
      - IBarcodeService / BarcodeDialogService (barcode image generation upstream)

  - name: Patient Registration ViewModel (UI orchestration)
    description: >
      Single orchestration surface that the Patient Module screen binds to.
      Wires Patient + Visit + Invoice + Barcode + Print + Navigation +
      TestCatalog into one MVVM controller. CanExecute rules tie every
      command to SessionContext permissions (PatientsView / PatientsEdit)
      and to lifecycle state (PatientId, CurrentVisitId, IsEditMode).
    files:
      - Open_lab/ViewModels/PatientRegistrationViewModel.cs
    endpoints:
      - method: CALL
        path: PatientRegistrationViewModel.SaveAsync()
        description: >
          Validates FullName, then creates or updates the patient, saves
          medical history, and chains into SaveVisitAndInvoiceAsync.
          Switches IsEditMode=false on success.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.SaveVisitAndInvoiceAsync()
        description: >
          When SelectedTests is non-empty, opens a TransactionScope, creates
          a new Visit (or loads CurrentVisitId), adds missing visit tests,
          upserts the Invoice via IInvoiceService, then completes the
          transaction. Emits an Arabic status message and rethrows on failure.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.GenerateLabIdAsync()
        description: Calls PatientService.GenerateNextLabIdAsync(today) only when PatientId==0.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.LoadByLabIdAsync / LoadByCodeAsync / SearchAsync / LoadTodayPatientsAsync
        description: Search/load surface — populates Results, QuickPatientsList, and the form.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.ShowBarcode()
        description: >
          Builds the barcode sample-label set: "Serum Fasting" when IsFasting,
          one label per selected test, plus extra sample-type labels (Blood /
          Urine / Stool / Semen / CSF). Refuses when neither PatientId nor
          LabId is set.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.PrintReceiptAsync()
        description: >
          Loads visit/tests/invoice/patient from DB (or falls back to in-memory
          state for unit tests) and calls IPrintService.PrintReceiptAsync.
          Requires CurrentVisitId > 0.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.PrintWorksheetAsync()
        description: >
          Computes tests count from DB when a visit is saved, refuses when no
          tests are selected, then calls IPrintService.PrintWorksheetByPatientAsync.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.AddSelectedTest / AddAllVisibleTests / RemoveSelectedTest
        description: >
          Maintains the in-memory SelectedTests grid and triggers DB delete
          for already-persisted VisitTests on remove (G4.3).
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.ApplyTestFilterAsync()
        description: >
          Filters AvailableTests by category (TM=routine, CC=send-out, TG=all)
          and free-text search across NameReport/NameReceipt/Code.
        auth_required: true
      - method: CALL
        path: PatientRegistrationViewModel.SettleBalanceAsync()
        description: >
          "خالص" — sets PaidAmount so balance==0, calls IInvoiceService.CreateOrUpdateInvoiceAsync, rolls the paid amount into PreviousPaidAmount.
        auth_required: true
    depends_on:
      - IPatientService
      - IVisitService
      - IInvoiceService
      - IBarcodeDialogService (which depends on IBarcodeService + IPrintService)
      - IPrintService
      - ITestCatalogService
      - INavigationService
      - SessionContext / PermissionCodes

known_limitations:
  - issue: >
      PatientRegistrationViewModel.SaveVisitAndInvoiceAsync wraps work in a
      System.Transactions.TransactionScope, but EF Core + SQLite (the default
      provider in OpenLabDbContext) does NOT support ambient transactions.
      The same flow on SaveRegistrationAsync uses EF Core's explicit
      BeginTransactionAsync (Fix #2). The ViewModel path can still throw
      "ambient transaction not supported" when run against SQLite.
    location: Open_lab/ViewModels/PatientRegistrationViewModel.cs:1514
    impact: Visit + invoice may not be saved atomically on SQLite-backed deployments.
  - issue: >
      PrintService.PrintDocument always resolves to "Microsoft Print to PDF"
      via ResolvePrintQueue() rather than the type-specific printer returned
      by ResolvePrintQueueAsync. The async resolver is defined but unused by
      the synchronous PrintDocument helper.
    location: Open_lab/Services/PrintService.cs:320
    impact: Receipt-vs-report printer routing from ISettingsService is effectively ignored.
  - issue: >
      PatientService.DeleteAsync refuses deletion only when Visits exist; it
      does not also block when MedicalHistories rows exist, which can leave
      orphaned medical-history rows if the FK is not cascading.
    location: Open_lab/Services/PatientService.cs:375
    impact: Possible orphaned MedicalHistory row after delete depending on schema.
  - issue: >
      VisitService.AddTestToVisitAsync uses overridePrice when provided,
      bypassing the referral price list — which is the intended behavior but
      means the caller (PatientRegistrationViewModel passes the selected
      test's price) can save a price that does not match the contract.
    location: Open_lab/Services/VisitService.cs:154
    impact: Contract pricing can be overridden by the registration screen without an audit trail.
  - issue: >
      ResultsService.SaveResultCoreAsync skips the EDIT_RESULT audit row when
      userId is null/zero (e.g. when the legacy 5-arg overload is used by
      tests/UI code that does not pass a userId), so result edits made via
      that path are not logged.
    location: Open_lab/Services/ResultsService.cs:71
    impact: Audit gap for result edits made through the legacy overload.
  - issue: >
      PatientRegistrationViewModel.GenerateLabIdAsync is called on every
      ClearFormAsync and on Initialize; if multiple registration screens are
      open simultaneously they can race to the same candidate LabId — Create
      will detect the duplicate but the user sees a "LabId already exists"
      error rather than a fresh ID.
    location: Open_lab/ViewModels/PatientRegistrationViewModel.cs:1128
    impact: Race condition on concurrent registrations in multi-user installs.
